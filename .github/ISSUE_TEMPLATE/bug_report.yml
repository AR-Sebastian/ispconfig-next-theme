name: Bug report
description: Report a reproducible problem in NEXT
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Theme version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: ISPConfig, PHP and browser versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
