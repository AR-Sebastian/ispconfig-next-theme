name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate tag and version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - name: Build assets
        run: bash scripts/build-release.sh
      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ispconfig-next-theme-*.zip
            dist/ispconfig-next-theme-*.tar.gz
            dist/SHA256SUMS.txt

