<!-- WP-974: native Workbench authentication surface; controller contract unchanged. -->
					<tmpl_if name="msg">
					<div class="wb-auth-feedback wb-auth-feedback--success" role="alert"><tmpl_var name="msg"></div>
					</tmpl_if>
					<tmpl_if name="error">
					<div class="wb-auth-feedback wb-auth-feedback--danger" role="alert"><tmpl_var name="error"></div>
					</tmpl_if>
					<form class="wb-auth-form" accept-charset="UTF-8" role="form" method="post" action="index.php">
                    <fieldset>
						<div class="wb-auth-field">
							<input class="form-control" placeholder="{tmpl_var name='username_txt'}" name="username" id="username" type="text" autocomplete="username" autofocus>
			    		</div>
			    		<div class="wb-auth-field">
							<input class="form-control" placeholder="{tmpl_var name='password_txt'}" name="password" id="password" type="password" value="" autocomplete="current-password">
			    		</div>
						<tmpl_if name="session_allow_endless" value="y">
						<div class="checkbox wb-login-stay-option">
			    	    	<label>
								<input name="stay" id="stay" type="checkbox" value="1" data-wb-remember-login="1"> <span>{tmpl_var name='stay_logged_in_txt'}</span>
			    	    	</label>
							<small>{tmpl_var name='stay_logged_in_hint_txt'}</small>
							</div>
						</tmpl_if>
						<div class="checkbox wb-login-remember-option">
							<label>
								<input name="remember_username" id="remember_username" type="checkbox" value="1" data-wb-remember-username="1"> <span>Remember username</span>
							</label>
							<small>Store only the username on this device.</small>
							</div>
						<div class="wb-login-password-manager-hint" role="note">
							<span aria-hidden="true">&#10003;</span>
							<small>Your password manager can securely store the password.</small>
						</div>
						<input type="hidden" name="s_mod" value="login" />
						<input type="hidden" name="s_pg" value="index" />
						<div class="wb-auth-actions">
			    		<input class="wb-auth-secondary" type="submit" value="{tmpl_var name='login_txt'}">
						<tmpl_if name="pw_lost_show"><button class="wb-auth-secondary" type="button" value="{tmpl_var name='pw_lost_txt'}" data-login-navigate="password_reset.php">{tmpl_var name='pw_lost_txt'}</button></tmpl_if>
						</div>
			    	</fieldset>
			      	</form>
